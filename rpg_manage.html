<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sombra do Condor - Tático</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="shortcut icon" href="sombra do condor.png" type="image/x-icon">
    <style>
        :root {
            --bg-dark: #0a0a0f;
            --bg-panel: #16161c;
            --accent: #8257e6;
            --accent-hover: #9d7bef;
            --text: #e1e1e6;
            --text-muted: #a8a8b3;
            --highlight: #252530;
            --danger: #e83f5b;
            --success: #04d361;
            --border: #2d2d3a;
            --pe-color: #4ecca3;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0f;
            color: var(--text);
            padding: 20px;
            min-height: 100vh;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        .title {
            text-align: center;
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        /* Área de Importação */
        .import-section {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 30px;
            display: flex;
            gap: 10px;
            flex-direction: column;
        }

        textarea {
            width: 100%;
            background: #0f0f14;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px;
            border-radius: 6px;
            font-family: monospace;
            resize: vertical;
            min-height: 80px;
        }

        .btn-primary { 
            background: var(--accent); 
            color: white; 
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.2s;
        }
        .btn-primary:hover { background: var(--accent-hover); }

        /* Grid de Cards */
        .char-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--bg-panel);
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow: hidden;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* Cabeçalho do Card */
        .card-header {
            padding: 15px 20px;
            background: linear-gradient(to right, rgba(130, 87, 230, 0.15), transparent);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .char-name { 
            font-size: 1.2rem; 
            font-weight: 900; 
            color: #fff; 
            text-transform: uppercase; 
        }

        /* Grid de Atributos (NOVO) */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 2px;
            background: #000;
            padding: 2px 0;
            border-bottom: 1px solid var(--border);
        }

        .stat-box {
            background: var(--highlight);
            text-align: center;
            padding: 8px 2px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        /* Destaque para Defesa */
        .stat-box.def { background: rgba(130, 87, 230, 0.15); }

        .stat-box label { 
            font-size: 0.6rem; 
            color: var(--text-muted); 
            font-weight: 700; 
            margin-bottom: 2px;
        }
        .stat-box span { 
            font-size: 1rem; 
            font-weight: 800; 
            color: #fff; 
        }
        .stat-box.def span { color: var(--accent); }

        /* Barras de Vida/PE */
        .bars-container { padding: 15px 20px; }
        .stat-row { margin-bottom: 15px; }
        
        .stat-label { 
            display: flex; 
            justify-content: space-between; 
            font-weight: 800; 
            font-size: 0.75rem; 
            margin-bottom: 6px; 
            text-transform: uppercase; 
        }
        
        .bar-bg { 
            background: #0a0a0f; 
            height: 10px; 
            border-radius: 5px; 
            overflow: hidden; 
            border: 1px solid #333; 
        }
        .bar-fill { height: 100%; transition: width 0.3s ease; }
        .hp-fill { background: var(--danger); }
        .pe-fill { background: var(--pe-color); }

        /* Botões de Controle (+/-) */
        .controls { 
            display: flex; 
            gap: 4px; 
            margin-top: 8px; 
        }
        .ctrl-btn { 
            flex: 1;
            background: var(--highlight); 
            border: none; 
            color: var(--text-muted); 
            padding: 6px; 
            border-radius: 4px; 
            cursor: pointer; 
            font-weight: 700; 
            font-size: 0.7rem; 
            transition: 0.2s;
        }
        .ctrl-btn:hover { background: var(--border); color: #fff; }
        .ctrl-btn.heal:hover { background: rgba(4, 211, 97, 0.2); color: var(--success); }
        .ctrl-btn.dmg:hover { background: rgba(232, 63, 91, 0.2); color: var(--danger); }

        /* Detalhes */
        .btn-expand {
            width: 100%;
            background: transparent;
            border: none;
            border-top: 1px solid var(--border);
            color: var(--text-muted);
            padding: 10px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.7rem;
            text-transform: uppercase;
        }
        .btn-expand:hover { background: rgba(255,255,255,0.03); color: var(--accent); }

        .details-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
            background: rgba(0,0,0,0.2);
            padding: 0 20px;
        }
        .details-content.open { 
            max-height: 800px; 
            padding-top: 20px; 
            padding-bottom: 20px; 
            overflow-y: auto; 
        }

        .detail-block { margin-bottom: 15px; }
        .detail-header { 
            color: var(--accent); 
            font-size: 0.7rem; 
            font-weight: 900; 
            margin-bottom: 5px; 
            letter-spacing: 1px;
        }
        .detail-text { 
            font-size: 0.8rem; 
            color: #ccc; 
            line-height: 1.4; 
            white-space: pre-wrap; 
        }

        .delete-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: transparent;
            color: #444;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            z-index: 10;
        }
        .delete-btn:hover { color: var(--danger); }

    </style>
</head>
<body>

    <div class="container">
        <div class="title">Painel Tático</div>

        <div class="import-section">
            <textarea id="importText" placeholder="Cole a ficha aqui..."></textarea>
            <button class="btn-primary" onclick="importCharacter()">+ Adicionar ao Combate</button>
        </div>

        <div class="char-grid" id="charGrid"></div>
    </div>

    <script>
        let characters = JSON.parse(localStorage.getItem('tacticalTrackerData')) || [];

        function save() {
            localStorage.setItem('tacticalTrackerData', JSON.stringify(characters));
            render();
        }

        // Função auxiliar para capturar seções inteiras
        function getSection(text, startAnchor, endAnchors) {
            const startIdx = text.search(new RegExp(startAnchor, "i"));
            if (startIdx === -1) return "";

            let sectionContent = text.substring(startIdx + startAnchor.length);
            let closestEnd = sectionContent.length;

            endAnchors.forEach(anchor => {
                const endIdx = sectionContent.search(new RegExp(anchor, "i"));
                if (endIdx !== -1 && endIdx < closestEnd) {
                    closestEnd = endIdx;
                }
            });

            return sectionContent.substring(0, closestEnd).replace(/_{2,}/g, '').trim();
        }

        function importCharacter() {
            const raw = document.getElementById('importText').value;
            if (!raw.trim()) return;

            // Extração de Dados Principais
            const name = raw.split('\n')[0].split('(')[0].trim();
            const vitMatch = raw.match(/Vitalidade:\s*(\d+)/i);
            const peMatch = raw.match(/Pontos de Esforço \(PE\):\s*(\d+)/i);
            const defMatch = raw.match(/Defesa:\s*(\d+)/i);

            // Extração de Todos os Atributos
            const forca = raw.match(/Força:\s*(\d+)/i)?.[1] || "0";
            const agi = raw.match(/Agilidade:\s*(\d+)/i)?.[1] || "0";
            const int = raw.match(/Intelecto:\s*(\d+)/i)?.[1] || "0";
            const pre = raw.match(/Presença:\s*(\d+)/i)?.[1] || "0";
            const vig = raw.match(/Vigor:\s*(\d+)/i)?.[1] || "0";

            // Seções de Texto
            const itens = getSection(raw, "Itens", ["Pericias:", "Perícias:", "Habilidades", "Condição:"]);
            const pericias = getSection(raw, "Perícias:|Pericias:", ["Habilidades", "Condição:"]);
            const habs = getSection(raw, "Habilidades", ["Condição:"]);
            const condicao = getSection(raw, "Condição:", ["---"]);

            const newChar = {
                id: Date.now(),
                name: name,
                maxHP: vitMatch ? parseInt(vitMatch[1]) : 10,
                currentHP: vitMatch ? parseInt(vitMatch[1]) : 10,
                maxPE: peMatch ? parseInt(peMatch[1]) : 5,
                currentPE: peMatch ? parseInt(peMatch[1]) : 5,
                stats: { forca, agi, int, pre, vig, def: defMatch ? defMatch[1] : '10' },
                details: { itens, pericias, habs, condicao }
            };

            characters.push(newChar);
            document.getElementById('importText').value = '';
            save();
        }

        function updateStat(id, type, amount) {
            const char = characters.find(c => c.id === id);
            if (!char) return;
            if (type === 'hp') char.currentHP = Math.min(char.maxHP, Math.max(0, char.currentHP + amount));
            else char.currentPE = Math.min(char.maxPE, Math.max(0, char.currentPE + amount));
            save();
        }

        function deleteChar(id) {
            if(confirm("Apagar personagem?")) {
                characters = characters.filter(c => c.id !== id);
                save();
            }
        }

        function toggleDetails(id) {
            document.getElementById(`details-${id}`).classList.toggle('open');
        }

        function render() {
            const grid = document.getElementById('charGrid');
            grid.innerHTML = characters.map(char => {
                const hpPerc = Math.max(0, (char.currentHP / char.maxHP) * 100);
                const pePerc = Math.max(0, (char.currentPE / char.maxPE) * 100);

                return `
                    <div class="card">
                        <button class="delete-btn" onclick="deleteChar(${char.id})">&times;</button>
                        
                        <div class="card-header">
                            <span class="char-name">${char.name}</span>
                        </div>

                        <div class="stats-grid">
                            <div class="stat-box"><label>AGI</label><span>${char.stats.agi}</span></div>
                            <div class="stat-box"><label>FOR</label><span>${char.stats.forca}</span></div>
                            <div class="stat-box"><label>INT</label><span>${char.stats.int}</span></div>
                            <div class="stat-box"><label>PRE</label><span>${char.stats.pre}</span></div>
                            <div class="stat-box"><label>VIG</label><span>${char.stats.vig}</span></div>
                            <div class="stat-box def"><label>DEF</label><span>${char.stats.def}</span></div>
                        </div>

                        <div class="bars-container">
                            <div class="stat-row">
                                <div class="stat-label">
                                    <span style="color:#ff5555">PV</span>
                                    <span>${char.currentHP}/${char.maxHP}</span>
                                </div>
                                <div class="bar-bg"><div class="bar-fill hp-fill" style="width: ${hpPerc}%"></div></div>
                                <div class="controls">
                                    <button class="ctrl-btn dmg" onclick="updateStat(${char.id}, 'hp', -10)">-10</button>
                                    <button class="ctrl-btn dmg" onclick="updateStat(${char.id}, 'hp', -1)">-1</button>
                                    <button class="ctrl-btn heal" onclick="updateStat(${char.id}, 'hp', 1)">+1</button>
                                    <button class="ctrl-btn heal" onclick="updateStat(${char.id}, 'hp', 10)">+10</button>
                                </div>
                            </div>

                            <div class="stat-row" style="margin-bottom:0">
                                <div class="stat-label">
                                    <span style="color:var(--pe-color)">PE</span>
                                    <span>${char.currentPE}/${char.maxPE}</span>
                                </div>
                                <div class="bar-bg"><div class="bar-fill pe-fill" style="width: ${pePerc}%"></div></div>
                                <div class="controls">
                                    <button class="ctrl-btn" onclick="updateStat(${char.id}, 'pe', -3)">-3</button>
                                    <button class="ctrl-btn" onclick="updateStat(${char.id}, 'pe', -1)">-1</button>
                                    <button class="ctrl-btn" onclick="updateStat(${char.id}, 'pe', 1)">+1</button>
                                    <button class="ctrl-btn" onclick="updateStat(${char.id}, 'pe', 5)">+5</button>
                                </div>
                            </div>
                        </div>

                        <button class="btn-expand" onclick="toggleDetails(${char.id})">Inventário e Habilidades</button>
                        
                        <div class="details-content" id="details-${char.id}">
                            ${char.details.itens ? `<div class="detail-block"><div class="detail-header">ITENS</div><div class="detail-text">${char.details.itens}</div></div>` : ''}
                            ${char.details.pericias ? `<div class="detail-block"><div class="detail-header">PERÍCIAS</div><div class="detail-text">${char.details.pericias}</div></div>` : ''}
                            ${char.details.habs ? `<div class="detail-block"><div class="detail-header">HABILIDADES</div><div class="detail-text">${char.details.habs}</div></div>` : ''}
                            ${char.details.condicao ? `<div class="detail-block"><div class="detail-header">CONDIÇÃO</div><div class="detail-text">${char.details.condicao}</div></div>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        render();
    </script>
</body>
</html>
